name: Deploy Node Second API

on:
  push:
    branches:
      - main
    paths:
      - 'node-second-api/**'
      - '.github/workflows/deploy-node.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC Sin Contraseñas)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR via Managed Identity
        run: az acr login --name acrmath2

      - name: Build and push Docker image
        run: |
          docker build -t acrmath2-e8gufkcsh9ezhbge.azurecr.io/node-second-api:${{ github.sha }} ./node-second-api
          docker push acrmath2-e8gufkcsh9ezhbge.azurecr.io/node-second-api:${{ github.sha }}

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          containerAppName: node-second-api
          resourceGroup: group_math_hds2
          imageToDeploy: acrmath2-e8gufkcsh9ezhbge.azurecr.io/node-second-api:${{ github.sha }}
