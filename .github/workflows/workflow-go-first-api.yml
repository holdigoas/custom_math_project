name: CI/CD Go First API

on:
  push:
    branches:
      - main
    paths:
      - 'go-first-api/**'
      - '.github/workflows/workflow-go-first-api.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'go-first-api/**'
      - '.github/workflows/workflow-go-first-api.yml'
  workflow_dispatch:

jobs:
  test:
    name: Run Go Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go-first-api/go.mod'
          cache-dependency-path: 'go-first-api/go.sum'

      - name: Run tests with race detector
        working-directory: ./go-first-api
        run: go test -v -race ./...

  build-and-deploy:
    name: Build Image & Deploy to Azure
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC Sin Contraseñas)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR via Managed Identity
        run: az acr login --name acrmath2

      - name: Build and push Docker image
        run: |
          docker build -t acrmath2-e8gufkcsh9ezhbge.azurecr.io/go-first-api:${{ github.sha }} ./go-first-api
          docker push acrmath2-e8gufkcsh9ezhbge.azurecr.io/go-first-api:${{ github.sha }}

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name go-first-api \
            --resource-group group_math_hds2 \
            --image acrmath2-e8gufkcsh9ezhbge.azurecr.io/go-first-api:${{ github.sha }}