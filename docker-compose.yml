services:
  node-second-api:
    build: ./node-second-api
    env_file:
      - ./node-second-api/.env
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1:3001/home" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  go-first-api:
    build: ./go-first-api
    env_file:
      - ./go-first-api/.env
    ports:
      - "3000:3000"
    depends_on:
      node-second-api:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1:3000/home" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
