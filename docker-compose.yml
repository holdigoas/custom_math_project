services:
  node-second-api:
    build: ./node-second-api
    environment:
      PORT: "3001"
    # Sin "ports": solo es accesible desde la red interna de Docker.
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1:3001/home" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  go-first-api:
    build: ./go-first-api
    environment:
      PORT: "3000"
      # "node-second-api" es el nombre del servicio: Docker lo resuelve como dirección.
      NODE_API_URL: http://node-second-api:3001
    ports:
      - "3000:3000"
    depends_on:
      node-second-api:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1:3000/home" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
